# Configuración de lychee para el link-checker de CI.
# Objetivo: detectar enlaces internos/relativos rotos entre notas (el gap real),
# sin que CI se vuelva inestable por servicios externos que limitan peticiones.

max_retries = 2
timeout = 20

# No descender en el directorio de git.
exclude_path = [".git"]

# Excluir (por regex sobre la URL):
#  - fragmento vacío de placeholders href="#"
#  - correo (mailto:)
#  - hosts de badges/imágenes decorativas que limitan peticiones desde CI
#    (shields.io, skillicons, capsule-render, readme-typing-svg).
# Los enlaces relativos entre notas y los doc links reales (gtfobins,
# hackthebox.com) SÍ se verifican.
exclude = [
  "^#$",
  "^mailto:",
  "img\\.shields\\.io",
  "skillicons\\.dev",
  "capsule-render\\.vercel\\.app",
  "readme-typing-svg\\.demolab\\.com",
  "git\\.io/typing-svg",
  "hackthebox\\.com",
  "javierrr13\\.github\\.io",
]
